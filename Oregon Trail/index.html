<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oregon Trail</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>THE OREGON TRAIL</h1>
        </header>
        
        <div class="game-content">
            <div id="game-output" class="game-output"></div>
            
            <div class="input-section">
                <div id="prompt-container" style="display: none;"></div>
                <div id="input-container" style="display: none;">
                    <input type="text" id="text-input" placeholder="Enter your choice...">
                    <button id="submit-btn">Submit</button>
                </div>
                <div id="choice-container" style="display: none;"></div>
                <div id="loading-message" style="color: #ffd700; text-align: center; padding: 20px;">
                    Loading game...
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/browser-ui.js"></script>
    <script type="module" src="src/index-browser.js"></script>
</body>
</html>
