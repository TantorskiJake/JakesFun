{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1>My Favorite Pokémon</h1>
  
  <nav class="main-nav">
    <a href="/random" class="nav-link">Random Pokémon</a>
    <a href="/team" class="nav-link">Random Team</a>
    <a href="/history" class="nav-link">History</a>
    <button class="nav-link" id="darkModeToggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
  </nav>
  
  <div class="button-container" style="margin-bottom: 20px;">
    <button class="reload-button" onclick="exportFavorites('json')">Export as JSON</button>
    <button class="reload-button" onclick="exportFavorites('csv')">Export as CSV</button>
    <button class="reload-button" onclick="importFavorites()">Import Favorites</button>
    <input type="file" id="importFileInput" accept=".json,.csv" style="display: none;" onchange="handleFileImport(event)">
    <div class="sort-container" style="display: inline-block; margin-left: 20px;">
      <label for="favoritesSort" class="filter-label-small">Sort by:</label>
      <select id="favoritesSort" class="generation-select" onchange="sortFavorites()">
        <option value="date">Date Added</option>
        <option value="name">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="id">ID (Low-High)</option>
        <option value="id-desc">ID (High-Low)</option>
      </select>
    </div>
  </div>
  
  <div id="favoritesContainer" class="favorites-grid">
    <!-- Favorites will be loaded by JavaScript -->
  </div>
  
  <div id="emptyFavorites" class="empty-state" style="display: none;">
    <p>No favorites yet! Start adding Pokémon to your favorites.</p>
    <a href="/random" class="reload-button">Get Random Pokémon</a>
  </div>
</div>
{% endblock %}
