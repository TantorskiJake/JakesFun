<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Random Pokémon{% endblock %}</title>
    <!-- Add the Google Fonts link here -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-shell.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Audio element for Pokémon cry (optional - will fail gracefully if file doesn't exist) -->
    <audio id="cryAudio" preload="auto" style="display: none;">
        <!-- Audio will be loaded dynamically if available -->
    </audio>
    
    <!-- Include the JavaScript file -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
